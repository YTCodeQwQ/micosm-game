# Keep both native services on loopback. Replace the hostnames and use your
# existing ACME/certificate automation for the two TLS server blocks.

server {
    listen 443 ssl http2;
    server_name katago-ai.example.com;

    ssl_certificate /etc/letsencrypt/live/katago-ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/katago-ai.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
    }
}

server {
    listen 443 ssl http2;
    server_name rapfi-ai.example.com;

    ssl_certificate /etc/letsencrypt/live/rapfi-ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rapfi-ai.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 2m;
    }
}
