name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run verify:linux
      - run: npm audit --omit=dev
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
